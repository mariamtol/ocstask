{% extends "base.html" %}
{% block title %}เข้าสู่ระบบ - ระบบมอบหมายและติดตามงาน{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-5 col-lg-4">
    <div class="text-center mb-4">
      <div class="login-logo"><i class="bi bi-kanban"></i></div>
      <h1 class="h4 fw-bold mt-3">ระบบมอบหมายและติดตามงาน</h1>
      <p class="text-muted">Task Management System</p>
    </div>
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <form method="post">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <div class="mb-3">
            <label class="form-label">ชื่อผู้ใช้</label>
            <input name="username" class="form-control" required autofocus autocomplete="username">
          </div>
          <div class="mb-3">
            <label class="form-label">รหัสผ่าน</label>
            <input name="password" type="password" class="form-control" required autocomplete="current-password">
          </div>
          <button class="btn btn-primary w-100"><i class="bi bi-box-arrow-in-right"></i> เข้าสู่ระบบ</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
